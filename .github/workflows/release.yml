# 推送到 main：在 Windows 上用 MSVC 编译、打安装包、做启动冒烟测试（不发布）
# 推送 v* 标签：同上，并创建 GitHub Release，上传安装包和便携版 exe
name: Release

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - name: Version
        id: ver
        shell: pwsh
        run: |
          if ("${{ github.ref_type }}" -eq "tag") { $v = "${{ github.ref_name }}".TrimStart("v") } else { $v = "0.0.0" }
          "version=$v" >> $env:GITHUB_OUTPUT
          Write-Host "version: $v"

      # 不指定生成器版本：用构建机上装的 Visual Studio
      # 输出同时写入 ci.log，失败时摘要会作为公开的注释显示（不登录也能看到）
      - name: Configure
        shell: pwsh
        run: |
          cmake -B build -A x64 *>&1 | Tee-Object -FilePath ci.log -Append
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build
        shell: pwsh
        run: |
          cmake --build build --config MinSizeRel *>&1 | Tee-Object -FilePath ci.log -Append
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Smoke test
        # 启动程序几秒，确认没有崩溃，且首次运行写出了配置文件
        continue-on-error: true
        shell: pwsh
        run: |
          $p = Start-Process -FilePath build/MinSizeRel/CountDay.exe -PassThru
          Start-Sleep -Seconds 6
          $cfg = Join-Path $env:APPDATA "CountDay\config.json"
          Write-Host "process exited: $($p.HasExited)"
          if (Test-Path $cfg) { Get-Content $cfg } else { Write-Host "config.json not found" }
          $ok = (-not $p.HasExited) -and (Test-Path $cfg)
          if (-not $p.HasExited) { Stop-Process -Id $p.Id -Force }
          Write-Host "::notice title=Smoke test::running=$(-not $p.HasExited) config=$(Test-Path $cfg) ok=$ok"
          if (-not $ok) { Write-Error "smoke test failed" }

      - name: Build installer
        shell: pwsh
        run: |
          $iscc = Join-Path ${env:ProgramFiles(x86)} "Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup -y --no-progress
            $iscc = Join-Path ${env:ProgramFiles(x86)} "Inno Setup 6\ISCC.exe"
          }
          & $iscc "/DAppVersion=${{ steps.ver.outputs.version }}" "/DSourceExe=..\build\MinSizeRel\CountDay.exe" installer\CountDay.iss *>&1 | Tee-Object -FilePath ci.log -Append
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Copy-Item build/MinSizeRel/CountDay.exe dist/CountDay-portable.exe
          Get-ChildItem dist | Format-Table Name, Length

      - name: Report errors
        if: failure()
        shell: pwsh
        run: |
          if (-not (Test-Path ci.log)) { Write-Host "::error title=CI::no ci.log"; exit 0 }
          $hits = Get-Content ci.log | Where-Object { $_ -match '(?i)error|warning C|fatal|not found|cannot' } | Select-Object -First 25
          if (-not $hits) { $hits = Get-Content ci.log -Tail 25 }
          $msg = ($hits | ForEach-Object { $_.Trim() }) -join '%0A'
          Write-Host "::error title=CI log::$msg"

      - uses: actions/upload-artifact@v4
        with:
          name: CountDay-win-x64
          path: dist/*

      - name: Create release
        if: github.ref_type == 'tag'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" (Get-ChildItem dist/* | ForEach-Object FullName) `
            --title "倒计日 ${{ github.ref_name }}" `
            --notes-file .github/release-notes.md
